<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project NexGen — Login</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232562eb'/%3E%3Ctext x='32' y='46' font-family='Arial Black, Arial' font-size='36' font-weight='900' fill='%23ffffff' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<script>try{if(localStorage.getItem("nx_theme")==="dark"||(localStorage.getItem("nx_theme")==null&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.dataset.theme="dark"}catch(e){}</script>
<style>
  :root {
    --bg: #f6f8fb; --panel: #ffffff; --panel2: #eef2f7; --border: #d9e0ea;
    --text: #1a2233; --muted: #64748b; --green: #089981; --red: #f23645;
    --blue: #2563eb;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #0e141f; --panel: #161d2b; --panel2: #1e2635; --border: #2a3447;
    --text: #e6ebf5; --muted: #96a3b6; --green: #2fbf8f; --red: #f4646f;
    --blue: #6ea8fe;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 14px;
  }
  .box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 34px 38px; width: min(380px, 92vw);
    box-shadow: 0 10px 30px rgba(16, 24, 40, .1);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px;
  }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .01em; }
  .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 22px; }
  .box input {
    width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 11px 14px; font-size: 14px; font-family: inherit; margin-bottom: 14px;
  }
  .box input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
  .box input.input-err { border-color: var(--red); }
  .box button {
    width: 100%; background: var(--blue); border: 1px solid var(--blue); color: #fff;
    border-radius: 8px; padding: 11px; font-size: 14px; font-weight: 600; font-family: inherit;
    cursor: pointer;
  }
  .box button:hover { filter: brightness(1.06); }
  .box button:disabled { opacity: .5; cursor: not-allowed; }
  .err { color: var(--red); font-size: 12.5px; margin: 10px 0 0; min-height: 16px; }
  .attempts { color: var(--muted); font-size: 11px; margin-top: 8px; text-align: center; }
  .ok { color: var(--green); font-size: 13px; font-weight: 600; margin: 10px 0 0; min-height: 16px; }
</style>
</head>
<body>
  <div class="box">
    <div class="brand"><span class="logo">N</span><h1>Project NexGen</h1></div>
    <div class="sub">Dashboard protegida — introduz a password para continuar</div>
    <form id="loginForm">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" autofocus>
      <button type="submit" id="btn">Entrar</button>
    </form>
    <div class="err" id="err"></div>
    <div class="ok" id="ok"></div>
    <div class="attempts" id="attempts"></div>
  </div>
<script>
const form = document.getElementById("loginForm");
const btn = document.getElementById("btn");
const err = document.getElementById("err");
const ok = document.getElementById("ok");
const passwordInput = document.getElementById("password");
const attempts = document.getElementById("attempts");
let tries = 0;

function showError(msg) {
  err.textContent = msg;
  passwordInput.classList.add("input-err");
  btn.textContent = "Password incorreta";
  btn.disabled = true;
  setTimeout(() => {
    btn.textContent = "Entrar";
    btn.disabled = false;
    passwordInput.classList.remove("input-err");
  }, 1500);
}

form.onsubmit = async (e) => {
  e.preventDefault();
  err.textContent = "";
  ok.textContent = "";
  btn.disabled = true;
  btn.textContent = "A verificar…";
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: passwordInput.value }),
    });
    const d = await r.json();
    if (r.status === 429) {
      // lockout server-side: desativa o formulário até expirar a janela
      const wait = Math.max(1, Math.min(600, parseInt(d.retry_after || "60", 10)));
      btn.textContent = "Bloqueado";
      attempts.textContent = `Demasiadas tentativas — tenta dentro de ${wait}s`;
      showError(d.error || "Demasiadas tentativas");
      passwordInput.value = "";
      let left = wait;
      const iv = setInterval(() => {
        left -= 1;
        if (left <= 0) {
          clearInterval(iv);
          btn.disabled = false;
          btn.textContent = "Entrar";
          attempts.textContent = "";
          passwordInput.focus();
        } else {
          attempts.textContent = `Bloqueado — tenta dentro de ${left}s`;
        }
      }, 1000);
      return;
    }
    if (r.status === 401 || d.error) {
      tries++;
      const left = d.attempts_left;
      attempts.textContent = left != null && left > 0
        ? `Tentativa ${tries} — ${left} tentativa(s) antes do bloqueio`
        : (tries > 1 ? `Tentativa ${tries} — acesso negado` : "");
      btn.disabled = false;
      showError(d.error || "Password incorreta");
      passwordInput.value = "";
      passwordInput.focus();
      return;
    }
    ok.textContent = "Password correta — a entrar…";
    btn.textContent = "Password correta";
    setTimeout(() => { window.location.href = "/"; }, 500);
  } catch (_) {
    err.textContent = "Falha de ligação ao servidor";
    btn.disabled = false;
    btn.textContent = "Entrar";
  }
};
</script>
</body>
</html>
